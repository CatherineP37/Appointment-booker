{% extends 'appointments/base.html'%}
{% load static %}
{% block title %}
    Password reset
{% endblock %}
{% block content %}    
    <section>
        <section class="section-container">
            <h2>Set a new password</h2>
            <h4>Enter your email to receive a link to reset your password</h4>
            <form method = "POST" class="form">
                {% csrf_token %}               
                <div>
                    <h4>{{ form.email.label }}*</h4>
                        {{ form.email }}
                </div>                   
                <button type="submit" class="button-dark">Enter your email address</button>
            </form>
        </section> 
                                  
    </section>        
{% endblock %}
